<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Dungeon</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#cfc4a4">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#cfc4a4;--key:#b9ad8c;--ink:#2e2c27;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#26241f;--key:#3b382f;--ink:#cfc4a4}}
:root[data-theme="dark"]{--bg:#26241f;--key:#3b382f;--ink:#cfc4a4}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-family:"Courier New",monospace}
canvas{width:min(100vw,54vh);aspect-ratio:1;image-rendering:pixelated;display:block;margin-top:6px}
#pad{display:flex;justify-content:space-between;align-items:center;width:min(100vw,420px);padding:8px 18px 14px;box-sizing:border-box}
.dp{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:2px}
.b{background:var(--key);border:3px solid var(--ink);border-radius:6px;color:var(--ink);font:bold 22px "Courier New",monospace;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--ink)}
.b.on{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#A{width:84px;height:84px;border-radius:50%;font-size:26px}
</style></head><body>
<canvas id="c" width="160" height="160"></canvas>
<div id="pad">
<div class="dp">
<span></span><div class="b" data-k="u">▲</div><span></span>
<div class="b" data-k="l">◀</div><span></span><div class="b" data-k="r">▶</div>
<span></span><div class="b" data-k="d">▼</div><span></span>
</div>
<div class="b" id="A">A</div>
</div>
<script>
const P=['#d1c5a5','#a79d83','#6b6657','#2e2c27'];
const cv=document.getElementById('c'),g=cv.getContext('2d');
const T=16,HUD=16;
const SP={
 p:['..2222..','.223322.','.233332.','..2332..','.222222.','2.2222.2','..2..2..','.33..33.'],
 s:['........','..3333..','.322223.','.323323.','.322223.','.333333.','........','........'],
 c:['.333333.','31111113','31122113','31122113','31122113','31111113','.333333.','........'],
 h:['.33.33..','3223223.','3222223.','.32223..','..323...','...3....']
};
const LINES=['WHERE DID YOU|BRING ME, BUDDY?','GRAB ALL COINS|TO OPEN THE GATE.','SLIMES AHEAD...|HIT THEM WITH A!'];
function spr(a,x,y,s=2){for(let r=0;r<a.length;r++)for(let c=0;c<8;c++){const ch=a[r][c];if(ch!=='.'){g.fillStyle=P[+ch];g.fillRect(x+c*s,y+r*s,s,s)}}}
const k={l:0,r:0,u:0,d:0};
let st;
function solid(tx,ty){
 if(tx<0||ty<0||tx>9||ty>8)return true;
 if(ty==0&&(tx==4||tx==5))return !st.open;
 return tx==0||tx==9||ty==0||ty==8||st.pil.some(q=>q[0]==tx&&q[1]==ty);
}
function free(x,y){return [[3,3],[12,3],[3,12],[12,12]].every(([a,b])=>!solid((x+a)/T|0,(y+b)/T|0))}
function mv(e,dx,dy){if(free(e.x+dx,e.y))e.x+=dx;if(free(e.x,e.y+dy))e.y+=dy}
function reset(){st={lvl:0,hp:3,gold:0,over:0,win:0};load()}
function load(){
 const L=st.lvl;
 st.pil=[[],[[3,3],[6,3],[3,5],[6,5]],[[2,2],[7,2],[4,4],[5,4],[2,6],[7,6]]][L];
 st.open=0;st.p={x:72,y:112,d:[0,-1],atk:0,inv:0};st.coins=[];st.sl=[];
 const spot=()=>{for(;;){const tx=1+Math.random()*8|0,ty=1+Math.random()*7|0;if(solid(tx,ty))continue;const x=tx*T,y=ty*T;if(Math.hypot(x-72,y-112)<40)continue;return{x,y}}};
 for(let i=0;i<3+L;i++)st.coins.push(spot());
 for(let i=0;i<1+L;i++){const s=spot();s.t=Math.random()*99;st.sl.push(s)}
 st.dlg=LINES[L];
}
function upd(){
 if(st.dlg||st.over||st.win)return;
 const p=st.p,dx=k.r-k.l,dy=k.d-k.u;
 if(dx||dy){p.d=dx?[dx,0]:[0,dy];mv(p,dx*1.1,dy*1.1)}
 if(p.inv>0)p.inv--;
 if(p.atk>0){p.atk--;
  const sx=p.x+8+p.d[0]*10,sy=p.y+8+p.d[1]*10;
  st.sl=st.sl.filter(s=>{if(Math.abs(s.x+8-sx)<10&&Math.abs(s.y+8-sy)<10){st.coins.push({x:s.x,y:s.y});return false}return true});
 }
 st.coins=st.coins.filter(c=>{if(Math.abs(c.x-p.x)<10&&Math.abs(c.y-p.y)<10){st.gold++;return false}return true});
 st.open=st.coins.length==0;
 for(const s of st.sl){
  s.t++;const ex=p.x-s.x,ey=p.y-s.y,dist=Math.hypot(ex,ey);
  if(dist<72){mv(s,ex/dist*.4,ey/dist*.4)}
  else{mv(s,Math.cos(s.t/40)*.3,Math.sin(s.t/33)*.3)}
  if(dist<10&&!p.inv){st.hp--;p.inv=70;mv(p,-ex/dist*8,-ey/dist*8)}
 }
 if(st.hp<=0)st.over=1;
 if(st.open&&p.y<6){if(st.lvl==2)st.win=1;else{st.lvl++;load()}}
}
function txt(t,x,y,c=3,al='left'){g.fillStyle=P[c];g.textAlign=al;g.textBaseline='top';g.font='bold 8px "Courier New",monospace';g.fillText(t,x,y)}
function box(x,y,w,h){g.fillStyle=P[3];g.fillRect(x,y,w,h);g.fillStyle=P[0];g.fillRect(x+2,y+2,w-4,h-4)}
function draw(){
 g.fillStyle=P[0];g.fillRect(0,0,160,160);
 spr(SP.c,2,0,1);txt(String(st.gold),12,0);
 for(let i=0;i<3;i++){const a=SP.h;for(let r=0;r<6;r++)for(let c=0;c<7;c++){const ch=a[r][c];if(ch!=='.'){g.fillStyle=i<st.hp?P[+ch]:P[1];if(i>=st.hp&&ch=='3')g.fillStyle=P[2];g.fillRect(58+i*10+c,5+r,1,1)}}}
 txt('DUNGEON '+(st.lvl+1),158,0,3,'right');
 g.save();g.translate(0,HUD);
 for(let ty=0;ty<9;ty++)for(let tx=0;tx<10;tx++){
  const x=tx*T,y=ty*T;
  if(ty==0&&(tx==4||tx==5)&&!st.open){g.fillStyle=P[3];g.fillRect(x,y,T,T);g.fillStyle=P[2];for(let i=2;i<16;i+=4)g.fillRect(x+i,y,2,T);continue}
  if(solid(tx,ty)){
   g.fillStyle=P[2];g.fillRect(x,y,T,T);g.fillStyle=P[3];g.fillRect(x,y+7,T,2);g.fillRect(x,y+15,T,1);g.fillRect(x+((ty+tx)%2?4:10),y,2,8);g.fillRect(x+((ty+tx)%2?10:4),y+8,2,8);
   g.fillStyle=P[1];g.fillRect(x,y,T,1);
  }else if((tx*7+ty*13)%9==0){g.fillStyle=P[1];g.fillRect(x+6,y+8,2,2)}
 }
 for(const c of st.coins)spr(SP.c,c.x,c.y);
 for(const s of st.sl)spr(SP.s,s.x,s.y+Math.sin(s.t/8)*1);
 const p=st.p;
 g.fillStyle=P[1];g.fillRect(p.x+3,p.y+14,10,2);
 if(!(p.inv&&p.inv%8<4))spr(SP.p,p.x,p.y);
 if(p.atk>0){const sx=p.x+8+p.d[0]*10,sy=p.y+8+p.d[1]*10;g.fillStyle=P[3];g.fillRect(sx-4,sy-4,8,8);g.fillStyle=P[0];g.fillRect(sx-2,sy-2,4,4)}
 g.restore();
 if(st.dlg){
  box(4,104,152,52);spr(SP.p,118,112,4);
  const l=st.dlg.split('|');txt(l[0],12,114);txt(l[1],12,126);
  if(Date.now()%800<500)txt('TAP A',12,142,2);
 }
 if(st.over||st.win){
  box(24,60,112,40);
  txt(st.win?'YOU ESCAPED!':'GAME OVER',80,68,3,'center');
  txt(st.win?st.gold+' COINS':'TAP A TO RETRY',80,82,2,'center');
  if(st.win)txt('TAP A TO REPLAY',80,91,2,'center');
 }
}
function act(){
 if(st.dlg){st.dlg=null;return}
 if(st.over||st.win){reset();return}
 if(!st.p.atk)st.p.atk=12;
}
document.querySelectorAll('[data-k]').forEach(el=>{
 const n=el.dataset.k;
 const on=e=>{e.preventDefault();k[n]=1;el.classList.add('on')};
 const off=e=>{e.preventDefault();k[n]=0;el.classList.remove('on')};
 el.addEventListener('pointerdown',on);
 ['pointerup','pointerleave','pointercancel'].forEach(t=>el.addEventListener(t,off));
});
const A=document.getElementById('A');
A.addEventListener('pointerdown',e=>{e.preventDefault();A.classList.add('on');act()});
['pointerup','pointerleave','pointercancel'].forEach(t=>A.addEventListener(t,()=>A.classList.remove('on')));
cv.addEventListener('pointerdown',()=>{if(st.dlg)act()});
const KM={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'u',w:'u',ArrowDown:'d',s:'d'};
addEventListener('keydown',e=>{if(KM[e.key]){k[KM[e.key]]=1;e.preventDefault()}else if([' ','z','Enter'].includes(e.key)){act();e.preventDefault()}});
addEventListener('keyup',e=>{if(KM[e.key])k[KM[e.key]]=0});
let last=performance.now(),acc=0;
function loop(t){acc+=Math.min(t-last,100);last=t;while(acc>=1000/60){upd();acc-=1000/60}draw();requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop);
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body></html>
